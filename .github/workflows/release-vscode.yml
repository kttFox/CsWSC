name: Release VS Code Extension

on:
  push:
    tags: ['vscode-v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Set version from tag
        if: startsWith(github.ref, 'refs/tags/')
        shell: pwsh
        run: |
          $ver = '${{ github.ref_name }}'.Substring('vscode-v'.Length)
          while ($ver.Split('.').Count -lt 3) { $ver += '.0' }   # 1.0 -> 1.0.0
          $path = 'editors/vscode/package.json'
          $json = Get-Content $path -Raw -Encoding UTF8
          $json = $json -replace '("version"\s*:\s*)"[^"]*"', "`$1`"$ver`""
          [IO.File]::WriteAllText((Resolve-Path $path), $json)
          Write-Host "version: $ver"

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Publish language server
        shell: pwsh
        run: |
          dotnet publish src/CsWSC.LanguageServer -c Release -o editors/vscode/server --nologo
          if ($LASTEXITCODE -ne 0) { exit 1 }

      # 解析サーバーが Windows 専用なので win32-x64 向けとしてパッケージする
      - name: Package VSIX
        shell: pwsh
        working-directory: editors/vscode
        run: |
          New-Item -ItemType Directory -Force ../../artifacts | Out-Null
          Remove-Item ../../artifacts/*.vsix -ErrorAction SilentlyContinue
          npx --yes @vscode/vsce package --target win32-x64 --no-dependencies -o ../../artifacts/
          if ($LASTEXITCODE -ne 0) { exit 1 }

      - name: Publish to Marketplace
        if: startsWith(github.ref, 'refs/tags/')
        shell: pwsh
        env:
          VSCE_PAT: ${{ secrets.VSCE_PAT }}
        run: |
          $vsix = (Get-ChildItem artifacts/*.vsix).FullName
          npx --yes @vscode/vsce publish --packagePath $vsix
          if ($LASTEXITCODE -ne 0) { exit 1 }

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          name: VS Code Extension ${{ github.ref_name }}
          files: artifacts/*.vsix
          generate_release_notes: true
          make_latest: false

      - uses: actions/upload-artifact@v4
        with:
          name: vscode ${{ github.ref_name }}
          path: artifacts/*.vsix
