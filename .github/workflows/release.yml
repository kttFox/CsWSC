name: Release

on:
  push:
    tags: ['v[0-9]*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Publish CsWSC
        shell: pwsh
        run: |
          dotnet publish src/CsWSC.UI -c Release -r win-x64 --self-contained false -o out/CsWSC --nologo
          if ($LASTEXITCODE -ne 0) { exit 1 }
          New-Item -ItemType Directory -Force artifacts | Out-Null
          Compress-Archive -Path out/CsWSC/* -DestinationPath "artifacts/CsWSC-${{ github.ref_name }}-win-x64.zip" -Force

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${{ github.ref_name }}" (Get-ChildItem artifacts/*.zip).FullName --title "${{ github.ref_name }}" --generate-notes

      - uses: actions/upload-artifact@v4
        with:
          name: CsWSC-${{ github.ref_name }}
          path: artifacts/*.zip
